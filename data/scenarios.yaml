# Experimental grid. Instrument wording, change rules, the default baseline,
# and the bid ladder live in instrument.yaml -- edit that file to retune
# what a model sees. Averages stay derived from the baseline plus the change
# apply map.
#
# Optional per-scenario keys (unused in the default grid):
#   baseline     override the instrument default shares
#   description  override the change-line wording for this cell only

scenarios:
  # --- local watershed (HUC4) -------------------------------------------- #
  - id: one_level_local_watershed
    change: one_level
    locality: local
    spatial_unit: watershed
    area_sq_miles: 17000
    home_level: 4

  - id: min2_local_watershed
    change: min2
    locality: local
    spatial_unit: watershed
    area_sq_miles: 17000
    home_level: 4

  - id: min3_local_watershed
    change: min3
    locality: local
    spatial_unit: watershed
    area_sq_miles: 17000
    home_level: 4
    notes: >-
      Dominated by min2_local_watershed for this baseline. The pair is the
      sharpest single test in the design: a strict superset of improvements, so
      a lower recommended WTP is an error rather than a preference.

  # --- non-local watershed ------------------------------------------------ #
  - id: one_level_nonlocal_watershed
    change: one_level
    locality: nonlocal
    spatial_unit: watershed
    area_sq_miles: 17000

  - id: min2_nonlocal_watershed
    change: min2
    locality: nonlocal
    spatial_unit: watershed
    area_sq_miles: 17000

  - id: min3_nonlocal_watershed
    change: min3
    locality: nonlocal
    spatial_unit: watershed
    area_sq_miles: 17000

  # --- full study region -------------------------------------------------- #
  - id: one_level_region
    change: one_level
    locality: region
    spatial_unit: study_region
    area_sq_miles: 425000
    home_level: 4

  - id: min2_region
    change: min2
    locality: region
    spatial_unit: study_region
    area_sq_miles: 425000
    home_level: 4

  - id: min3_region
    change: min3
    locality: region
    spatial_unit: study_region
    area_sq_miles: 425000
    home_level: 4
