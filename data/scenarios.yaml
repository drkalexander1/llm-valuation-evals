# Valuation scenarios for the referendum arm.
#
# Baseline level distribution is held FIXED across spatial units, using the
# study-region distribution from Vossler et al. 2023 SI Figure S2. The real
# survey drew a respondent-specific baseline from their own watershed; holding
# it fixed here isolates the two things Table 2's columns actually vary --
# policy area size and whether the area includes the respondent's home -- at the
# cost of departing from the specific numbers any one respondent saw. Recorded
# as a deviation in PLAN.md.
#
# Figure S2 shares sum to 99.49, not 100 (published rounding). The schema
# normalizes, which puts the baseline average at 3.54 against the published 3.52.
#
# Area: a watershed of 17,000 sq mi is stated in the instrument as 4% of the
# study area, giving ~425,000 sq mi for the full region.

bids: [20, 50, 75, 100, 150, 200, 250, 350, 500, 750]

_baseline: &study_region_baseline
  shares:
    2: 4.36
    3: 41.63
    4: 48.97
    5: 4.53

scenarios:
  # --- local watershed (HUC4) -------------------------------------------- #
  - id: one_level_local_watershed
    change: one_level
    locality: local
    spatial_unit: watershed
    area_sq_miles: 17000
    baseline: *study_region_baseline
    home_level: 4

  - id: min2_local_watershed
    change: min2
    locality: local
    spatial_unit: watershed
    area_sq_miles: 17000
    baseline: *study_region_baseline
    home_level: 4

  - id: min3_local_watershed
    change: min3
    locality: local
    spatial_unit: watershed
    area_sq_miles: 17000
    baseline: *study_region_baseline
    home_level: 4
    notes: >-
      Dominated by min2_local_watershed for this baseline. The pair is the
      sharpest single test in the design: a strict superset of improvements, so
      a lower recommended WTP is an error rather than a preference.

  # --- non-local watershed ------------------------------------------------ #
  - id: one_level_nonlocal_watershed
    change: one_level
    locality: nonlocal
    spatial_unit: watershed
    area_sq_miles: 17000
    baseline: *study_region_baseline
    home_level: null

  - id: min2_nonlocal_watershed
    change: min2
    locality: nonlocal
    spatial_unit: watershed
    area_sq_miles: 17000
    baseline: *study_region_baseline
    home_level: null

  - id: min3_nonlocal_watershed
    change: min3
    locality: nonlocal
    spatial_unit: watershed
    area_sq_miles: 17000
    baseline: *study_region_baseline
    home_level: null

  # --- full study region -------------------------------------------------- #
  - id: one_level_region
    change: one_level
    locality: region
    spatial_unit: study_region
    area_sq_miles: 425000
    baseline: *study_region_baseline
    home_level: 4

  - id: min2_region
    change: min2
    locality: region
    spatial_unit: study_region
    area_sq_miles: 425000
    baseline: *study_region_baseline
    home_level: 4

  - id: min3_region
    change: min3
    locality: region
    spatial_unit: study_region
    area_sq_miles: 425000
    baseline: *study_region_baseline
    home_level: 4
